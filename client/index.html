<!DOCTYPE html> <!-- tells the browser this is a modern HTML page -->
<html lang="en"> <!-- root of the page, sets the lang to ENGLISH -->

    <head>
        <meta charset="UTF-8"> <!-- supports all characters, incl. emojis -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- makes the page scale correctly on phones -->
        <title>Ticket Tracker App</title>
    </head>

    <body>
        <header>
            <h1>Ticket Tracker</h1>
        </header>

        <main>
            <section>
                <h2>New Ticket</h2>
                <form>
                    <!--TITLE-->
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Printer not working">

                    <!--DESCRIPTION-->
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>

                    <!--PRIORITY-->
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>

                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="network">Network</option>
                        <option value="account">Account/Access</option>
                    </select>

                    <button type="submit">Submit Ticket</button>
                </form>
            </section>

            <section>
                <h2>Tickets</h2>
            </section>

        </main>

        <footer>
            <p>Built by Mervin Raja, 2026</p>
        </footer>
    </body>

</html>
